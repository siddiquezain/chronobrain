[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "chronopace"
version = "0.1.0"
description = "ChronoPace — Decision Intelligence for the Energy Battle"
requires-python = ">=3.11"

# NOTE: a single "." entry is deliberate. Listing [".", "tests"] made pytest
# silently collect only the tests/ subtree (28 of 112 tests) — the root-level
# Stack A suite (test_planner.py, test_confidence_gate.py, ...) was never run in CI.
[tool.pytest.ini_options]
testpaths = ["."]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
